<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="9つのことばを組み合わせて、物語の種を見つける道具です。"
    />
    <meta name="theme-color" content="#f7f1e5" />
    <link
      rel="canonical"
      href="https://nikonikoaniki-svg.github.io/monogatarino-tane/"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="物語の種" />
    <meta property="og:title" content="物語の種" />
    <meta
      property="og:description"
      content="9つのことばから、ひとつの物語を。"
    />
    <meta
      property="og:url"
      content="https://nikonikoaniki-svg.github.io/monogatarino-tane/"
    />
    <meta
      property="og:image"
      content="https://nikonikoaniki-svg.github.io/monogatarino-tane/og-image-v2.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://nikonikoaniki-svg.github.io/monogatarino-tane/og-image-v2.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="物語の種――9つのことばから、ひとつの物語を。" />
    <meta name="note:card" content="summary_large_image" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="物語の種" />
    <meta
      name="twitter:description"
      content="9つのことばから、ひとつの物語を。"
    />
    <meta
      name="twitter:image"
      content="https://nikonikoaniki-svg.github.io/monogatarino-tane/og-image-v2.jpg"
    />
    <meta name="twitter:image:alt" content="物語の種――9つのことばから、ひとつの物語を。" />
    <title>物語の種</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="paper-grain" aria-hidden="true"></div>
      <section class="seed-maker" aria-labelledby="page-title">
        <header class="title-block">
          <p class="eyebrow">STORY SEED MAKER</p>
          <h1 id="page-title">物語の種</h1>
          <p class="lead">9つのことばから、ひとつの物語を。</p>
        </header>

        <p class="hint">ことばにふれると、意味が見られます。</p>

        <div
          id="seed-grid"
          class="seed-grid"
          aria-busy="true"
          aria-label="物語の種となる9つのことば"
        ></div>

        <button id="make-button" class="make-button" type="button" disabled>
          <span class="button-mark" aria-hidden="true">✦</span>
          <span id="button-label">ことばを準備しています…</span>
        </button>

        <p class="after-note">
          ひとつ選んでも、いくつか組み合わせてもかまいません。
        </p>
        <p id="announcement" class="sr-only" aria-live="polite"></p>
        <p id="load-error" class="load-error" hidden>
          ことばのデータを読み込めませんでした。words.jsonがindex.htmlと同じ場所にあるか確認してください。
        </p>
      </section>
    </main>

    <div id="meaning-tooltip" class="meaning-tooltip" role="tooltip" hidden>
      <span class="meaning-label">ことばの意味</span>
      <span id="meaning-text"></span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
